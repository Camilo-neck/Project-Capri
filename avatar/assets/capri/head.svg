<!-- Capri's head, shared by every pose. Origin (0,0) = center of the mask.
     Groups: crown (black spikes behind the mask), mask (green panes).
     Anchors (invisible circles, r = size): eye-l, eye-r, mouth, and eye-x* for the extra eyes of the menace pose. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 230">
  <g id="crown">
    <!-- long black spikes fanning out of the head -->
    <polygon fill="#07050c" points="-58,-6 -128,-62 -64,-34 -86,-112 -40,-46 -30,-128 -12,-48 8,-122 18,-46 52,-118 46,-40 118,-96 64,-22 126,-40 62,12 58,44 24,70 -22,70 -56,40" />
    <polygon fill="#07050c" points="-60,20 -112,46 -66,46" />
    <polygon fill="#07050c" points="60,22 118,36 64,46" />
  </g>
  <g id="mask">
    <!-- two green panes meeting in a V notch at the top, split by a black seam -->
    <polygon fill="#16f46c" points="-60,-40 -6,-16 -4,30 -54,26" />
    <polygon fill="#16f46c" points="6,-16 62,-44 56,24 4,30" />
    <!-- dark creases cutting into the panes, like in the show -->
    <polygon fill="#07050c" points="-60,-40 -46,-34 -58,-14" />
    <polygon fill="#07050c" points="62,-44 48,-36 60,-16" />
    <polygon fill="#07050c" points="-6,-16 -14,-12 -6,-4" />
    <polygon fill="#07050c" points="6,-16 14,-12 6,-4" />
  </g>
  <circle id="eye-l" cx="-30" cy="4" r="17" fill="none" />
  <circle id="eye-r" cx="32" cy="2" r="17" fill="none" />
  <circle id="mouth" cx="0" cy="50" r="30" fill="none" />
  <circle id="eye-x1" cx="-50" cy="-24" r="8" fill="none" />
  <circle id="eye-x2" cx="52" cy="-30" r="8" fill="none" />
  <circle id="eye-x3" cx="-14" cy="-6" r="6" fill="none" />
  <circle id="eye-x4" cx="16" cy="-8" r="6" fill="none" />
  <circle id="eye-x5" cx="-48" cy="18" r="7" fill="none" />
  <circle id="eye-x6" cx="48" cy="16" r="7" fill="none" />
</svg>
