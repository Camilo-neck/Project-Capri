[project]
name = "capri-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
]
