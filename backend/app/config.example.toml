# Configuración de Capri. Se crea sola la primera vez en %APPDATA%\Capri\config.toml;
# edítala con cualquier editor. Los cambios valen desde la siguiente vez que Capri la use.

# El asistente del primer arranque (elige su cerebro y su voz para este PC). Pon false para verlo otra vez,
# o ábrelo desde el panel (General > Asistente de inicio).
[inicio]
listo = false

# Nombres cortos para abrir apps (siempre te pide confirmación antes). nombre = "programa o ruta".
# Capri también puede abrir cualquier otro programa por su nombre o ruta, con la misma confirmación.
[apps]
"bloc de notas" = "notepad.exe"
calculadora = "calc.exe"

# Rutinas: una frase tuya que hace varias cosas a la vez, sin pasar por el modelo. Se dicen o se escriben solas
# ("modo chamba", "activa el modo chamba"), y solo si son para ella (con su nombre por voz). Abre programas normales
# (lo que pediría clic en rojo, no) y pone una canción en Spotify. "modo chamba" ya viene hecha; aquí la cambias o
# añades otras.
# [rutinas.chamba]
# frases = ["modo chamba"]
# apps = ["vscode", "warp"]
# musica = "lofi hip hop"   # búsqueda en Spotify ("" = sin música)
# tipo = "cancion"          # una playlist o un álbum solo se abren: hay que darle play

# Scripts que puede ejecutar por su nombre (siempre con confirmación, sin argumentos).
# (Los archivos y comandos ya no necesitan lista: ver "Seguridad" en docs/arquitectura.md.)
# nombre = "ruta al .ps1, .bat, .cmd, .py o .exe"
[scripts]

[calendario]
# Tu calendario: la dirección iCal (Google, Outlook.com, iCloud: https o webcal), la ruta de un
# archivo .ics de tu PC, u "outlook" (Outlook para Windows). Si está vacía, pídele a Capri que te
# ayude; sin calendario sus recordatorios y las alarmas de Windows siguen funcionando.
url = ""
# Cuántos minutos antes de cada evento te avisa.
aviso_minutos = 10

# Spotify, para que ponga la música que le pidas. Client ID de una app de
# https://developer.spotify.com/dashboard con este Redirect URI registrado tal cual.
# Luego dile a Capri "conecta Spotify". Que suene solo requiere Spotify Premium.
[spotify]
client_id = ""
redirect_uri = "http://127.0.0.1:5173/callback"

# Lo que Capri hace sola en el escritorio. Se aplica la próxima vez que le toque moverse.
[avatar]
deambular = true        # se teletransporta de vez en cuando a otro sitio de la barra o a una ventana
poseer_ventanas = true  # a veces se mete en la ventana donde está sentada (solo dibuja encima)
estilo = "original"     # "original" (el arte de la serie) o "pixel"; el atajo de [atajos] lo alterna y lo guarda aquí
camara = false          # modo cámara: sus primeros planos de la serie en un recuadro de transmisión; el atajo lo alterna
dormir_min = 20         # minutos sin usar el PC ni hablarle para dormirse hasta quedar en la máscara; 0 = nunca
reaccionar_pc = true    # reacciona a tu PC: procesador al máximo, cargador, batería, red, USB, mando o teléfono, juegos

# Cuándo habla sin que le escribas: saludo del día y algún comentario si lleva rato sin hablaros.
# Los avisos del calendario no cuentan para el máximo, pero el modo no molestar los calla también.
[proactividad]
activa = true
max_por_hora = 2
inactividad_horas = 2
silencio = "23:00-08:00"  # horas en las que no habla por iniciativa propia ("" = nunca)

# Su cerebro. Se cambia desde el panel de la bandeja (clic derecho en su icono › Cerebro) o aquí.
# "ollama": un modelo local (gratis, nada sale del PC). "anthropic" (Claude) u "openai" (GPT): en la nube,
# con tu clave (se guarda en el Administrador de credenciales de Windows, o ANTHROPIC_API_KEY / OPENAI_API_KEY);
# entonces tus mensajes, lo que recuerda de ti y las capturas de /mira se envían a ese servicio.
[modelo]
proveedor = "ollama"       # "ollama", "claude_code" (tu plan de Claude, sin clave), "anthropic" o "openai"
nombre = "qwen3-vl:8b-instruct"
esfuerzo = "low"          # solo Claude: low | medium | high (más piensa, más tarda)

# Voz: le hablas y ella contesta con texto, en español o inglés. El micrófono solo se abre cuando la voz está
# activa (interruptor "Voz" del panel de la bandeja) y el audio no sale de este PC ni se guarda.
[voz]
activa = true             # abrir el micrófono al arrancar (false: solo con el interruptor "Voz")
nombres = ["capri"]       # cómo la llamas: su nombre solo, al principio ("oye Capri, ...") o al final ("..., Capri")
llamada = true            # solo hace caso a lo que la llama por su nombre (false: solo con el atajo)
silencio_ms = 900         # silencio que da por terminada una frase
modelo = "turbo"          # modelo de faster-whisper (large-v3-turbo; "small" gasta menos GPU)
carpeta_modelo = ""       # dónde se descarga el modelo ("" = %LOCALAPPDATA%\Capri\modelos\whisper)
dispositivo = "auto"       # dónde corre Whisper: "auto" (la GPU si hay NVIDIA; si no, la CPU con "small"), "cuda" o "cpu"
hablar = true             # con la voz activa, te contesta en voz alta
voz = "aria"              # su voz (también en el panel): "aria" (Edge, en la nube: el texto va a Microsoft; sin internet, Dora), "capri" (clonada, GPU NVIDIA; si falla, Dora), "capri_ligera"
                          # (afinada a ella, CPU), "dora", "daniela", "claude_mx", "bella", "emma" (CPU). La clonada usa
                          # qwen/capri.wav (~10 s de ella) y qwen/capri.txt (lo que dice) en carpeta_tts
carpeta_tts = ""          # dónde están sus voces ("" = %LOCALAPPDATA%\Capri\modelos\tts)
velocidad = 1.0           # 0.7 a 1.5 (no aplica a su voz clonada)
robot = 0.0               # su toque metálico, 0 a 1 (también en el panel)
glitch = 0.0              # cuánto se le entrecorta la voz, 0 a 1 (también en el panel)
registro = true           # voz.log (junto a esta config): lo que oyó y era para ella, para ver qué entendió; nunca el audio

# Atajos globales. Si alguno choca con otra app, cámbialo aquí y reinicia Capri.
# Formato: modificadores (Ctrl, Alt, Shift, Super) y una tecla, separados por "+".
# La regla: Ctrl+Alt para hablarle (escribir, escuchar); Ctrl+Alt+Shift para lo demás.
[atajos]
escribir = "Ctrl+Alt+Space"
escuchar = "Ctrl+Alt+V"            # la siguiente frase es para ella, sin decir "hey Capri"; si habla, la corta
mirar = "Ctrl+Alt+Shift+M"
no_molestar = "Ctrl+Alt+Shift+D"
apariencia = "Ctrl+Alt+Shift+A"    # Original, Pixel art, Cámara
teletransporte = "Ctrl+Alt+Shift+T" # la trae (o la despierta, o la hace volver)
