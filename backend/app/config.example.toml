# Configuración de Capri. Se crea sola la primera vez en %APPDATA%\Capri\config.toml;
# edítala con cualquier editor. Los cambios valen desde la siguiente vez que Capri la use.

# Apps que Capri puede abrir (siempre te pide confirmación antes). nombre = "programa o ruta"
[apps]
"bloc de notas" = "notepad.exe"
calculadora = "calc.exe"

# Carpetas donde puede buscar archivos (solo mira nombres, nunca el contenido).
[rutas]
buscar = ["~/Documents"]

# Scripts que puede ejecutar por su nombre (siempre con confirmación, sin argumentos).
# nombre = "ruta al .ps1, .bat, .cmd, .py o .exe"
[scripts]

[calendario]
# Dirección secreta en formato iCal de tu Google Calendar. Si está vacía, pídele a Capri
# que te ayude a configurarla.
url = ""
# Cuántos minutos antes de cada evento te avisa.
aviso_minutos = 10

# Spotify, para que ponga la música que le pidas. Client ID de una app de
# https://developer.spotify.com/dashboard con este Redirect URI registrado tal cual.
# Luego dile a Capri "conecta Spotify". Que suene solo requiere Spotify Premium.
[spotify]
client_id = ""
redirect_uri = "http://127.0.0.1:5173/callback"

# Lo que Capri hace sola en el escritorio. Se aplica la próxima vez que le toque moverse.
[avatar]
deambular = true        # se teletransporta de vez en cuando a otro sitio de la barra o a una ventana
poseer_ventanas = true  # a veces se mete en la ventana donde está sentada (solo dibuja encima)
estilo = "original"     # "original" (el arte de la serie) o "pixel"; el atajo de [atajos] lo alterna y lo guarda aquí
camara = false          # modo cámara: sus primeros planos de la serie en un recuadro de transmisión; el atajo lo alterna
dormir_min = 20         # minutos sin usar el PC ni hablarle para dormirse hasta quedar en la máscara; 0 = nunca

# Cuándo habla sin que le escribas: saludo del día y algún comentario si lleva rato sin hablaros.
# Los avisos del calendario no cuentan para el máximo, pero el modo no molestar los calla también.
[proactividad]
activa = true
max_por_hora = 2
inactividad_horas = 2
silencio = "23:00-08:00"  # horas en las que no habla por iniciativa propia ("" = nunca)

# Atajos globales. Si alguno choca con otra app, cámbialo aquí y reinicia Capri.
# Formato: modificadores (Ctrl, Alt, Shift, Super) y una tecla, separados por "+".
[atajos]
escribir = "Ctrl+Alt+Space"
teletransporte = "Ctrl+Alt+T"
mirar = "Ctrl+Alt+Shift+M"
no_molestar = "Ctrl+Alt+Shift+D"
estilo = "Ctrl+Alt+Shift+P"
camara = "Ctrl+Alt+Shift+C"
