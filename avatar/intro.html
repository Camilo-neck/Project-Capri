<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Capri · intro</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* a stand-in desktop behind her */
      body { margin: 0; height: 100vh; overflow: hidden; background: radial-gradient(circle at 30% 30%, #2d5c8a, #10243b 70%); }
      .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; background: #1b1f27e6; }
      .spot { position: fixed; width: 12px; height: 12px; margin: -6px; border: 2px solid #fff8; border-radius: 50%; }
      #again { position: fixed; top: 12px; left: 12px; z-index: 10; font: 13px "JetBrains Mono", monospace; }
    </style>
    <script type="module" src="/src/intro-preview.ts"></script>
  </head>
  <body>
    <div class="bar"></div>
    <div class="spot" id="spot"></div>
    <button id="again">otra vez (?still: sin animaciones)</button>
    <canvas id="fx" class="fx"></canvas>
    <canvas id="intro" class="fx intro" hidden></canvas>
  </body>
</html>
