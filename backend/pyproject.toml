[project]
name = "capri-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "mss>=10.2.0",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyperclip>=1.11.0",
    "recurring-ical-events>=3.8.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]
