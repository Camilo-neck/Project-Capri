[project]
name = "capri-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "keyring>=25.7.0",
    "kokoro-onnx>=0.6.1",
    "mss>=10.2.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "ollama>=0.6.3",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.1",
    "pyperclip>=1.11.0",
    "recurring-ical-events>=3.8.2",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]
